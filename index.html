<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>間借りお会計帳</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fffaf2;
    --surface-2:      #fff1de;
    --surface-card:   #ffffff;
    --text-primary:   #2b1c10;
    --text-secondary: #745d49;
    --text-muted:     #a68d76;
    --gridline:       #f2ddc0;
    --border:         rgba(43,28,16,0.10);
    --series-1:       #ff7a33; /* pop orange - 現金 / primary */
    --series-2:       #ff3d78; /* pop pink-red - PayPay */
    --series-3:       #05c793; /* pop green - カード / success */
    --series-4:       #ffc23c; /* pop yellow - その他 */
    --status-good:    #05b076;
    --status-critical:#f0393f;
    --brand-grad:     linear-gradient(120deg, #ff8a3d, #ff3d78);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #201408;
      --surface-2:      #160d05;
      --surface-card:   #2c1c10;
      --text-primary:   #fff6ea;
      --text-secondary: #dcc0a4;
      --text-muted:     #a98d72;
      --gridline:       #3c2716;
      --border:         rgba(255,246,234,0.10);
      --series-1:       #ff9a5c;
      --series-2:       #ff6e9e;
      --series-3:       #2be3ac;
      --series-4:       #ffd166;
      --status-good:    #2be3ac;
      --status-critical:#ff6f74;
      --brand-grad:     linear-gradient(120deg, #ff8a3d, #ff3d78);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--surface-2);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    overscroll-behavior-y: contain;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--brand-grad);
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    box-shadow: 0 2px 10px rgba(255,61,120,0.25);
  }
  header.topbar h1 { font-size: 16px; margin: 0; font-weight: 800; display:flex; align-items:center; gap:6px; color: #fff; white-space: nowrap; flex-shrink: 0; }
  .sync-dot { width:9px; height:9px; border-radius:999px; background: rgba(255,255,255,0.5); flex-shrink:0; box-shadow: 0 0 0 2px rgba(255,255,255,0.35); }
  .sync-dot.ok { background: #2be3ac; }
  .sync-dot.err { background: #ffe14d; }
  .day-pill {
    display: flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,0.22);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .day-pill input[type=date] {
    border: none; background: transparent; color: #fff;
    font-size: 12px; font-family: inherit; font-weight: 700;
    max-width: 108px;
  }
  .day-pill input[type=date]::-webkit-calendar-picker-indicator { filter: invert(1); }

  main { flex: 1; padding: 14px 12px 92px; max-width: 720px; width: 100%; margin: 0 auto; }

  .screen { display: none; }
  .screen.active { display: block; }

  nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex;
    background: var(--surface-1);
    border-top: 1px solid var(--gridline);
    padding: 6px 8px env(safe-area-inset-bottom, 0);
    gap: 4px;
  }
  nav.tabbar button {
    flex: 1; border: none; background: transparent; color: var(--text-muted);
    padding: 8px 4px; font-size: 11px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; font-family: inherit; cursor: pointer;
    border-radius: 14px; font-weight: 700; margin: 2px 0;
  }
  nav.tabbar button .ic { font-size: 21px; line-height: 1; }
  nav.tabbar button.active { color: #fff; background: var(--brand-grad); box-shadow: 0 3px 10px rgba(255,61,120,0.3); }

  h2.section-title { font-size: 15px; color: var(--text-primary); font-weight: 800; margin: 20px 0 10px; }
  h2.section-title:first-child { margin-top: 4px; }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }

  .table-card {
    background: var(--surface-card);
    border: 1px solid var(--gridline);
    border-top: 4px solid var(--series-1);
    border-radius: 16px;
    padding: 14px;
    cursor: pointer;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: 0 3px 10px rgba(43,28,16,0.07);
    transition: transform .1s ease;
  }
  .table-card:nth-of-type(4n+2) { border-top-color: var(--series-2); }
  .table-card:nth-of-type(4n+3) { border-top-color: var(--series-3); }
  .table-card:nth-of-type(4n+4) { border-top-color: var(--series-4); }
  .table-card:active { transform: scale(0.97); }
  .table-card .label { font-weight: 800; font-size: 15px; }
  .table-card .meta { font-size: 12px; color: var(--text-muted); }
  .table-card .amount { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 4px; color: var(--series-1); }

  .add-card {
    border: 2px dashed color-mix(in srgb, var(--series-1) 45%, var(--gridline));
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 6px;
    min-height: 96px;
    color: var(--series-1);
    font-weight: 800; font-size: 14px;
    cursor: pointer; background: color-mix(in srgb, var(--series-1) 6%, transparent);
  }
  .add-card .ic { font-size: 28px; }

  .empty-state {
    text-align: center; color: var(--text-muted); padding: 40px 16px; font-size: 14px;
  }

  button { font-family: inherit; }
  .btn {
    border: none; border-radius: 16px; padding: 14px 16px; font-size: 15px; font-weight: 800;
    cursor: pointer; width: 100%;
  }
  .btn-primary { background: var(--brand-grad); color: #fff; box-shadow: 0 3px 10px rgba(255,61,120,0.3); }
  .btn-success { background: var(--series-3); color: #fff; box-shadow: 0 3px 10px rgba(5,199,147,0.3); }
  .btn-outline { background: transparent; border: 2px solid var(--gridline); color: var(--text-primary); }
  .btn-danger { background: transparent; color: var(--status-critical); border: 2px solid var(--status-critical); }
  .btn-sm { padding: 9px 14px; font-size: 13px; border-radius: 12px; width: auto; white-space: nowrap; flex-shrink: 0; }

  /* Overlay / detail sheet */
  .overlay {
    position: fixed; inset: 0; background: rgba(11,11,11,0.45);
    display: none; align-items: flex-end; z-index: 50;
  }
  .overlay.active { display: flex; }
  .sheet {
    background: var(--surface-1);
    width: 100%; max-height: 92vh; overflow-y: auto;
    border-radius: 18px 18px 0 0;
    padding: 14px 16px calc(20px + env(safe-area-inset-bottom, 0));
    margin: 0 auto; max-width: 720px;
  }
  .sheet-handle { width: 40px; height: 4px; background: var(--gridline); border-radius: 999px; margin: 0 auto 12px; }
  .sheet-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .sheet-header-fields { display: flex; flex-direction: column; flex: 1; min-width: 0; gap: 0; }
  .sheet-header input.label-input {
    font-size: 19px; font-weight: 800; border: none; background: transparent; color: var(--text-primary);
    width: 100%; min-width: 0; padding: 4px 0 0;
  }
  .sheet-header input.customer-input {
    font-size: 13px; font-weight: 500; border: none; background: transparent; color: var(--text-secondary);
    width: 100%; min-width: 0; padding: 0 0 4px;
  }
  .icon-btn {
    border: none; background: var(--surface-2); color: var(--text-secondary);
    width: 34px; height: 34px; border-radius: 999px; font-size: 16px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  .menu-cat { font-size: 13px; font-weight: 800; color: var(--series-1); margin: 16px 0 8px; }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap: 8px; }
  .menu-item-btn {
    border: 1px solid var(--gridline); background: var(--surface-card);
    border-radius: 14px; padding: 12px 10px; text-align: left; cursor: pointer;
    display: flex; flex-direction: column; gap: 3px;
    box-shadow: 0 2px 6px rgba(43,28,16,0.05);
  }
  .menu-item-btn:active { background: color-mix(in srgb, var(--series-1) 14%, var(--surface-card)); transform: scale(0.97); }
  .menu-item-btn .n { font-size: 13px; font-weight: 800; }
  .menu-item-btn .p { font-size: 12px; color: var(--series-1); font-weight: 700; font-variant-numeric: tabular-nums; }

  .order-list { margin-top: 14px; border-top: 2px solid var(--gridline); }
  .order-row {
    display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--gridline);
  }
  .order-row .name { flex: 1; font-size: 14px; font-weight: 600; }
  .order-row .line-total { font-size: 13px; color: var(--text-muted); width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  .qty-stepper { display: flex; align-items: center; gap: 8px; }
  .qty-stepper button {
    width: 30px; height: 30px; border-radius: 999px; border: none;
    background: var(--series-1); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
  }
  .qty-stepper .qty { min-width: 18px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }

  .total-row {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 0 6px; font-weight: 800;
  }
  .total-row .amount { font-size: 27px; font-variant-numeric: tabular-nums; color: var(--series-1); }

  .sheet-actions { display: flex; gap: 8px; margin-top: 14px; }

  /* Payment modal */
  .pay-methods { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin: 14px 0; }
  .pay-methods button {
    border: 2px solid var(--gridline); background: var(--surface-card); border-radius: 14px;
    padding: 16px 8px; font-size: 15px; font-weight: 800; cursor: pointer; color: var(--text-primary);
  }
  .pay-methods button.selected { border-color: var(--series-1); background: color-mix(in srgb, var(--series-1) 14%, var(--surface-card)); color: var(--series-1); }

  /* Menu edit screen */
  .menu-edit-row {
    display: flex; align-items: center; gap: 8px; padding: 10px; background: var(--surface-card);
    border: 1px solid var(--gridline); border-radius: 12px; margin-bottom: 8px;
  }
  .menu-edit-row input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--gridline); border-radius: 8px; padding: 8px; font-size: 14px; background: var(--surface-1); color: var(--text-primary); }
  .menu-edit-row input[type=number] { width: 80px; border: 1px solid var(--gridline); border-radius: 8px; padding: 8px; font-size: 14px; background: var(--surface-1); color: var(--text-primary); }
  .menu-edit-row select { border: 1px solid var(--gridline); border-radius: 8px; padding: 8px; font-size: 13px; background: var(--surface-1); color: var(--text-primary); }

  .add-menu-form {
    display: flex; flex-wrap: wrap; gap: 8px; background: var(--surface-card);
    border: 1px dashed var(--gridline); border-radius: 12px; padding: 12px; margin-bottom: 16px;
  }
  .add-menu-form input, .add-menu-form select { border: 1px solid var(--gridline); border-radius: 8px; padding: 9px; font-size: 14px; background: var(--surface-1); color: var(--text-primary); }
  .add-menu-form input[type=text].name { flex: 2; min-width: 100px; }
  .add-menu-form input[type=text].cat { flex: 1; min-width: 80px; }
  .add-menu-form input[type=number] { width: 90px; }
  .add-menu-form input#newPurchaseQty { width: 76px; }
  .add-menu-form select#newPurchaseTaxRate { flex: 1; min-width: 128px; font-weight: 700; }
  .add-menu-form .purchase-form-total {
    flex-basis: 100%; font-size: 13px; font-weight: 800; color: var(--series-1);
  }

  .tax-breakdown { display: flex; gap: 8px; margin-bottom: 14px; }
  .tax-breakdown .tax-tile {
    flex: 1; background: var(--surface-card); border: 1px solid var(--gridline); border-left: 4px solid var(--series-4);
    border-radius: 14px; padding: 10px 12px; box-shadow: 0 2px 6px rgba(43,28,16,0.05);
  }
  .tax-breakdown .tax-tile:nth-child(2) { border-left-color: var(--series-2); }
  .tax-breakdown .tax-tile .lbl { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
  .tax-breakdown .tax-tile .val { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tax-breakdown .tax-tile .sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .tax-badge {
    display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px;
    background: color-mix(in srgb, var(--series-4) 20%, transparent); color: color-mix(in srgb, var(--series-4) 60%, var(--text-primary));
    margin-left: 6px; vertical-align: middle;
  }
  .tax-badge.rate8 { background: color-mix(in srgb, var(--series-2) 18%, transparent); color: color-mix(in srgb, var(--series-2) 55%, var(--text-primary)); }

  /* 給与計算 (payroll) */
  .attendance-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .attendance-badge {
    flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 11px 12px; min-width: 0;
    border-radius: 12px; border: 1px solid var(--gridline); background: var(--surface-card);
    box-shadow: 0 2px 6px rgba(43,28,16,0.05);
  }
  .attendance-badge .ab-main { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; white-space: nowrap; }
  .attendance-badge .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--text-muted); flex-shrink: 0; }
  .attendance-badge.present { border-color: color-mix(in srgb, var(--status-good) 45%, var(--gridline)); }
  .attendance-badge.present .dot { background: var(--status-good); }
  .attendance-badge.absent { color: var(--text-muted); }
  .attendance-badge .sub { font-size: 11px; font-weight: 600; color: var(--text-muted); padding-left: 15px; }

  .settle-card {
    background: var(--surface-card); border: 1px solid var(--gridline); border-left: 4px solid var(--series-3);
    border-radius: 14px; padding: 14px; margin: 4px 0 18px; box-shadow: 0 2px 6px rgba(43,28,16,0.05);
  }
  .settle-card .lbl { font-size: 12px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
  .settle-card .val { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--status-good); }
  .settle-card.negative { border-left-color: var(--status-critical); }
  .settle-card.negative .val { color: var(--status-critical); }
  .settle-card .note { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }

  /* Summary screen */
  .mode-toggle { display: flex; gap: 8px; }
  .mode-toggle button {
    flex: 1; border: 2px solid var(--gridline); background: var(--surface-card); border-radius: 14px;
    padding: 10px; font-size: 13px; font-weight: 800; color: var(--text-secondary); cursor: pointer;
  }
  .mode-toggle button.active { background: var(--brand-grad); border-color: transparent; color: #fff; box-shadow: 0 3px 8px rgba(255,61,120,0.25); }
  .day-pill input[type=month] { border: none; background: transparent; color: var(--text-primary); font-size: 13px; font-family: inherit; }
  .stat-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px,1fr)); gap: 10px; margin-bottom: 20px; }
  .stat-tile.profit .val.negative { color: var(--status-critical); }
  .stat-tile.profit .val.positive { color: var(--status-good); }
  .day-row {
    display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--surface-card);
    border: 1px solid var(--gridline); border-radius: 14px; margin-bottom: 8px;
    box-shadow: 0 2px 6px rgba(43,28,16,0.05);
    cursor: pointer;
  }
  .day-row:active { transform: scale(0.98); }
  .day-row .info { flex: 1; min-width: 0; }
  .day-row .info .l { font-size: 14px; font-weight: 800; }
  .day-row .info .t { font-size: 11px; color: var(--text-muted); }
  .day-row .amt { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
  .day-row .amt .profit-sub { display:block; font-size: 11px; font-weight: 700; }
  .day-row .amt .profit-sub.negative { color: var(--status-critical); }
  .day-row .amt .profit-sub.positive { color: var(--status-good); }
  .stat-tile {
    background: var(--surface-card); border: 1px solid var(--gridline); border-radius: 14px; padding: 13px 10px;
    border-left: 4px solid var(--series-1);
    box-shadow: 0 2px 6px rgba(43,28,16,0.05);
  }
  .stat-tile:nth-of-type(2) { border-left-color: var(--series-4); }
  .stat-tile:nth-of-type(3) { border-left-color: var(--series-2); }
  .stat-tile:nth-of-type(4) { border-left-color: var(--status-critical); }
  .stat-tile:nth-of-type(5) { border-left-color: var(--series-3); }
  .stat-tile .lbl { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 700; }
  .stat-tile .val { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }

  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .bar-row .bar-label { width: 92px; font-size: 12px; color: var(--text-secondary); font-weight: 700; flex-shrink: 0; }
  .bar-track { flex: 1; height: 12px; background: var(--gridline); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }
  .bar-row .bar-val { width: 74px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-secondary); flex-shrink: 0; }

  .completed-wrap { margin-bottom: 8px; }
  .completed-row {
    display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--surface-card);
    border: 1px solid var(--gridline); border-radius: 14px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(43,28,16,0.05);
  }
  .completed-row.expanded { border-radius: 14px 14px 0 0; border-bottom-color: transparent; }
  .completed-row:active { transform: scale(0.99); }
  .completed-row .dot { width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; }
  .completed-row .info { flex: 1; min-width: 0; }
  .completed-row .info .l { font-size: 14px; font-weight: 800; }
  .completed-row .info .t { font-size: 11px; color: var(--text-muted); }
  .completed-row .amt { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .completed-row .chevron { color: var(--text-muted); font-size: 16px; flex-shrink: 0; }
  .completed-row.expanded .chevron { transform: rotate(90deg); }
  .completed-row .icon-btn { width: 30px; height: 30px; font-size: 14px; flex-shrink: 0; }

  .completed-detail {
    background: var(--surface-2); border: 1px solid var(--gridline); border-top: none;
    border-radius: 0 0 14px 14px; padding: 4px 14px;
  }
  .detail-item-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid var(--gridline); font-size: 13px;
  }
  .detail-item-row:last-child { border-bottom: none; }
  .detail-item-row .n { color: var(--text-secondary); font-weight: 600; }
  .detail-item-row .p { font-weight: 700; font-variant-numeric: tabular-nums; }
  .detail-item-row.empty { color: var(--text-muted); justify-content: center; }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: var(--surface-1); padding: 11px 20px;
    border-radius: 999px; font-size: 13px; font-weight: 800; z-index: 80;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
    box-shadow: 0 4px 14px rgba(43,28,16,0.25);
  }
  .toast.show { opacity: 1; }

  .confirm-box {
    background: var(--surface-1); border-radius: 20px; padding: 22px; max-width: 320px; width: 90%;
    margin: auto; text-align: center;
  }
  .confirm-box p { font-size: 14px; color: var(--text-secondary); margin: 8px 0 18px; }
  .confirm-box .row { display: flex; gap: 8px; }

  /* Passphrase lock screen */
  .lock-screen {
    position: fixed; inset: 0; z-index: 100;
    background: var(--brand-grad);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .lock-screen.hidden { display: none; }
  .lock-box { width: 100%; max-width: 320px; text-align: center; }
  .lock-box .ic { font-size: 44px; margin-bottom: 8px; }
  .lock-box h2 { font-size: 19px; margin: 0 0 4px; color: #fff; font-weight: 800; }
  .lock-box p { font-size: 13px; color: rgba(255,255,255,0.85); margin: 0 0 20px; }
  .lock-box input[type=password] {
    width: 100%; border: none; border-radius: 14px; padding: 15px;
    font-size: 16px; text-align: center; background: rgba(255,255,255,0.95); color: var(--text-primary);
    margin-bottom: 12px; font-weight: 700;
  }
  .lock-box .err-msg { color: #fff3c4; font-size: 13px; min-height: 18px; margin-bottom: 8px; font-weight: 700; }
  .lock-box .btn-primary { background: #fff; color: #ff3d78; box-shadow: 0 4px 14px rgba(0,0,0,0.2); }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1><span class="sync-dot" id="syncDot" title="同期状態"></span>🍶 間借りお会計帳</h1>
    <div class="day-pill">
      <span>営業日</span>
      <input type="date" id="dayPicker">
    </div>
  </header>

  <main>
    <!-- 卓一覧 -->
    <section class="screen active" id="screen-tables">
      <h2 class="section-title">営業中のお客様</h2>
      <div class="grid-cards" id="activeTablesGrid"></div>

      <div id="completedSummaryLink"></div>
    </section>

    <!-- メニュー編集 -->
    <section class="screen" id="screen-menu">
      <h2 class="section-title">メニューを追加</h2>
      <div class="add-menu-form">
        <input type="text" class="name" id="newItemName" placeholder="商品名">
        <input type="number" id="newItemPrice" placeholder="価格" min="0" step="10">
        <input type="text" class="cat" id="newItemCat" placeholder="カテゴリ（例: ドリンク）">
        <button class="btn btn-primary btn-sm" id="addMenuItemBtn">追加</button>
      </div>
      <div id="menuEditList"></div>
    </section>

    <!-- 仕入れ -->
    <section class="screen" id="screen-purchase">
      <h2 class="section-title">仕入れを記録</h2>
      <div class="add-menu-form">
        <input type="text" class="name" id="newPurchaseName" placeholder="品名（例: 氷・生ビール樽）">
        <input type="number" id="newPurchaseUnitPrice" placeholder="単価（税抜）" min="0" step="10">
        <input type="number" id="newPurchaseQty" placeholder="数量" min="1" step="1" value="1">
        <input type="text" class="cat" id="newPurchaseCat" placeholder="カテゴリ（例: お酒・氷）">
        <select id="newPurchaseTaxRate">
          <option value="10" selected>10%（標準）</option>
          <option value="8">8%（軽減税率）</option>
        </select>
        <div class="purchase-form-total" id="purchaseFormTotal">合計 ¥0</div>
        <button class="btn btn-primary btn-sm" id="addPurchaseBtn">追加</button>
      </div>
      <div class="total-row"><span>本日の仕入れ合計</span><span class="amount" id="purchaseTotal">¥0</span></div>
      <div class="tax-breakdown" id="purchaseTaxBreakdown"></div>
      <div id="purchaseList"></div>
    </section>

    <!-- 集計 -->
    <section class="screen" id="screen-summary">
      <div class="mode-toggle" id="summaryModeToggle">
        <button class="mode-btn active" data-mode="day">日次</button>
        <button class="mode-btn" data-mode="month">月次</button>
      </div>
      <div class="day-pill" id="monthPickerRow" style="display:none; margin:10px 0 0; width:fit-content;">
        <span>対象月</span>
        <input type="month" id="monthPicker">
      </div>
      <h2 class="section-title" id="summaryTitle">本日の集計</h2>
      <div class="stat-tiles" id="statTiles"></div>
      <h2 class="section-title">支払い方法の内訳</h2>
      <div id="paymentBars"></div>
      <div id="payrollSection">
        <h2 class="section-title">売上分配・給与計算</h2>
        <div class="attendance-row" id="attendanceRow"></div>
        <div class="stat-tiles" id="payrollTiles"></div>
        <div class="settle-card" id="managerSettleCard"></div>
      </div>
      <h2 class="section-title" id="breakdownTitle">お会計履歴</h2>
      <div id="completedList"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-screen="screen-tables"><span class="ic">🍽️</span>卓・お客様</button>
    <button class="tab-btn" data-screen="screen-menu"><span class="ic">📋</span>メニュー</button>
    <button class="tab-btn" data-screen="screen-purchase"><span class="ic">🧾</span>仕入れ</button>
    <button class="tab-btn" data-screen="screen-summary"><span class="ic">📊</span>集計</button>
  </nav>
</div>

<!-- Order detail sheet -->
<div class="overlay" id="orderOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-header-fields">
        <input type="text" class="label-input" id="orderLabelInput" placeholder="卓番">
        <input type="text" class="customer-input" id="orderCustomerInput" placeholder="お客様名（任意）">
      </div>
      <button class="icon-btn" id="closeOrderSheet">✕</button>
    </div>
    <div id="menuPicker"></div>
    <div class="order-list" id="orderLines"></div>
    <div class="total-row"><span>合計</span><span class="amount" id="orderTotal">¥0</span></div>
    <div class="sheet-actions">
      <button class="btn btn-danger btn-sm" id="deleteOrderBtn">卓を削除</button>
      <button class="btn btn-success" id="checkoutBtn">会計する</button>
    </div>
  </div>
</div>

<!-- Payment method sheet -->
<div class="overlay" id="payOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><strong>支払い方法を選択</strong><button class="icon-btn" id="closePaySheet">✕</button></div>
    <div class="total-row"><span>お会計金額</span><span class="amount" id="payAmount">¥0</span></div>
    <div class="pay-methods" id="payMethodButtons"></div>
    <div class="sheet-actions">
      <button class="btn btn-primary" id="confirmPayBtn">会計を確定する</button>
    </div>
  </div>
</div>

<!-- Generic confirm overlay -->
<div class="overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmText"></p>
    <div class="row">
      <button class="btn btn-outline btn-sm" id="confirmCancelBtn" style="flex:1">キャンセル</button>
      <button class="btn btn-danger btn-sm" id="confirmOkBtn" style="flex:1">削除する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Passphrase lock screen -->
<div class="lock-screen hidden" id="lockScreen">
  <div class="lock-box">
    <div class="ic">🔒</div>
    <h2>合言葉を入力してください</h2>
    <p>スタッフだけが使えるように、合言葉で保護しています</p>
    <input type="password" id="lockPinInput" placeholder="合言葉" autocomplete="off">
    <div class="err-msg" id="lockErrMsg"></div>
    <button class="btn btn-primary" id="lockSubmitBtn">入る</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";

  if (!window.supabase || !window.supabase.createClient) {
    document.body.innerHTML =
      '<div style="padding:32px 20px;text-align:center;font-family:system-ui,sans-serif;color:#52514e">' +
      '<div style="font-size:32px;margin-bottom:8px">📡</div>' +
      '<div style="font-weight:700;font-size:16px;color:#0b0b0b;margin-bottom:6px">読み込みに失敗しました</div>' +
      '<div style="font-size:14px">インターネット接続をご確認のうえ、ページを再読み込みしてください。</div>' +
      '</div>';
    return;
  }

  // ---------- Supabase connection (shared data for all staff/devices) ----------
  var SUPABASE_URL = "https://qpgtgcttlfmfmxiuqqjn.supabase.co";
  var SUPABASE_KEY = "sb_publishable_NMFhqlx3A_QrAH5wkVYyag_iIVDcVy5";
  var PIN_STORAGE_KEY = "izakaya-kaikei-pin";

  function makeClient(pin){
    return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      global: { headers: { "x-app-pin": pin || "" } }
    });
  }
  // Used only to verify a candidate passphrase (check_pin works regardless of header).
  var sb = makeClient("");

  var PAY_METHODS = [
    { id: "cash", label: "現金", color: "var(--series-1)" },
    { id: "paypay", label: "PayPay", color: "var(--series-2)" },
    { id: "card", label: "カード", color: "var(--series-3)" },
    { id: "other", label: "その他", color: "var(--series-4)" }
  ];

  function todayStr(){
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0,10);
  }

  function fmtYen(n){ return "¥" + Math.round(n).toLocaleString("ja-JP"); }

  function fmtTime(iso){
    if (!iso) return "";
    var d = new Date(iso);
    return (""+d.getHours()).padStart(2,"0") + ":" + (""+d.getMinutes()).padStart(2,"0");
  }

  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._tm);
    toast._tm = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  function setSyncDot(state){
    var el = document.getElementById("syncDot");
    if (!el) return;
    el.className = "sync-dot" + (state === "ok" ? " ok" : state === "err" ? " err" : "");
  }

  // ---------- App state (mirrors the current day / menu, refreshed from Supabase) ----------
  var menu = [];
  var dayData = { open: [], completed: [], purchases: [] };
  var currentDay = todayStr();
  var currentScreen = "screen-tables";
  var summaryMode = "day"; // "day" | "month"
  var activeOrderId = null;
  var pendingPayMethod = null;
  var confirmCallback = null;
  var labelSaveTimer = null;
  var customerSaveTimer = null;

  function orderTotalFromItems(items){
    return (items || []).reduce(function(s, it){ return s + it.price * it.qty; }, 0);
  }

  function normalizeOrder(o){
    o.items = (o.order_items || []).slice().sort(function(a,b){
      return (a.created_at || "").localeCompare(b.created_at || "");
    });
    o.computedTotal = o.status === "completed" && o.total != null ? o.total : orderTotalFromItems(o.items);
    return o;
  }

  function findOrder(id){
    return dayData.open.find(function(o){ return o.id === id; }) ||
           dayData.completed.find(function(o){ return o.id === id; });
  }

  function orderDisplayLabel(order){
    var base = order.label || "";
    if (order.customer_name) return base + " ・ " + order.customer_name;
    return base;
  }

  // ---------- Data loading ----------
  async function loadMenu(){
    var res = await sb.from("menu_items").select("*").order("category").order("name");
    if (res.error) { console.warn(res.error); setSyncDot("err"); toast("メニューの取得に失敗しました"); return; }
    menu = res.data || [];
    renderMenuPicker();
    renderMenuEdit();
  }

  async function loadDay(day){
    var ordersRes = await sb.from("orders")
      .select("*, order_items(*)")
      .eq("business_day", day)
      .order("opened_at", { ascending: true });
    var purchasesRes = await sb.from("purchases")
      .select("*")
      .eq("business_day", day)
      .order("created_at", { ascending: true });

    if (ordersRes.error || purchasesRes.error) {
      console.warn(ordersRes.error || purchasesRes.error);
      setSyncDot("err");
      toast("データの取得に失敗しました");
      return;
    }
    setSyncDot("ok");
    var orders = (ordersRes.data || []).map(normalizeOrder);
    dayData.open = orders.filter(function(o){ return o.status === "open"; });
    dayData.completed = orders.filter(function(o){ return o.status === "completed"; });
    dayData.purchases = purchasesRes.data || [];

    renderActiveTables();
    renderPurchases();
    if (activeOrderId) {
      if (findOrder(activeOrderId)) renderOrderLines();
      else { document.getElementById("orderOverlay").classList.remove("active"); activeOrderId = null; }
    }
    if (currentScreen === "screen-summary" && summaryMode === "day") renderDaySummary();
  }

  // ---------- Navigation ----------
  var tabBtns = document.querySelectorAll(".tab-btn");
  tabBtns.forEach(function(btn){
    btn.addEventListener("click", function(){
      tabBtns.forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
      document.getElementById(btn.dataset.screen).classList.add("active");
      currentScreen = btn.dataset.screen;
      if (currentScreen === "screen-summary") renderSummary();
      if (currentScreen === "screen-menu") renderMenuEdit();
      if (currentScreen === "screen-purchase") renderPurchases();
    });
  });

  var dayPicker = document.getElementById("dayPicker");
  dayPicker.value = currentDay;
  dayPicker.addEventListener("change", async function(){
    currentDay = dayPicker.value || todayStr();
    await loadDay(currentDay);
  });

  // ---------- Active tables screen ----------
  function renderActiveTables(){
    var grid = document.getElementById("activeTablesGrid");
    grid.innerHTML = "";

    dayData.open.forEach(function(order){
      var card = document.createElement("div");
      card.className = "table-card";
      var itemCount = order.items.reduce(function(s,it){ return s+it.qty; }, 0);
      card.innerHTML =
        '<div class="label">' + escapeHtml(orderDisplayLabel(order)) + '</div>' +
        '<div class="meta">' + itemCount + '点 ・ ' + fmtTime(order.opened_at) + '〜</div>' +
        '<div class="amount">' + fmtYen(order.computedTotal) + '</div>';
      card.addEventListener("click", function(){ openOrderSheet(order.id); });
      grid.appendChild(card);
    });

    var addCard = document.createElement("div");
    addCard.className = "add-card";
    addCard.innerHTML = '<span class="ic">＋</span><span>新しいお客様</span>';
    addCard.addEventListener("click", addNewTable);
    grid.appendChild(addCard);
  }

  async function addNewTable(){
    var num = dayData.open.length + dayData.completed.length + 1;
    var res = await sb.from("orders").insert({
      business_day: currentDay, label: num + "卓", status: "open"
    }).select().single();
    if (res.error) { console.warn(res.error); toast("卓の追加に失敗しました"); return; }
    await loadDay(currentDay);
    openOrderSheet(res.data.id);
  }

  // ---------- Order detail sheet ----------
  var orderOverlay = document.getElementById("orderOverlay");
  var orderLabelInput = document.getElementById("orderLabelInput");
  var orderCustomerInput = document.getElementById("orderCustomerInput");

  function openOrderSheet(id){
    activeOrderId = id;
    var order = findOrder(id);
    if (!order) return;
    orderLabelInput.value = order.label;
    orderCustomerInput.value = order.customer_name || "";
    renderMenuPicker();
    renderOrderLines();
    orderOverlay.classList.add("active");
  }

  function closeOrderSheet(){
    orderOverlay.classList.remove("active");
    activeOrderId = null;
    renderActiveTables();
  }

  document.getElementById("closeOrderSheet").addEventListener("click", closeOrderSheet);
  orderOverlay.addEventListener("click", function(e){ if (e.target === orderOverlay) closeOrderSheet(); });

  orderLabelInput.addEventListener("input", function(){
    var order = findOrder(activeOrderId);
    if (!order) return;
    order.label = orderLabelInput.value || "お客様";
    var idToSave = activeOrderId;
    var valToSave = order.label;
    clearTimeout(labelSaveTimer);
    labelSaveTimer = setTimeout(async function(){
      await sb.from("orders").update({ label: valToSave }).eq("id", idToSave);
    }, 500);
  });

  orderCustomerInput.addEventListener("input", function(){
    var order = findOrder(activeOrderId);
    if (!order) return;
    order.customer_name = orderCustomerInput.value || "";
    var idToSave = activeOrderId;
    var valToSave = order.customer_name;
    clearTimeout(customerSaveTimer);
    customerSaveTimer = setTimeout(async function(){
      await sb.from("orders").update({ customer_name: valToSave }).eq("id", idToSave);
    }, 500);
  });

  function renderMenuPicker(){
    var el = document.getElementById("menuPicker");
    el.innerHTML = "";
    if (menu.length === 0) {
      el.innerHTML = '<div class="empty-state">メニューが未登録です。「メニュー」タブから追加してください。</div>';
      return;
    }
    var byCat = {};
    var catOrder = [];
    menu.forEach(function(item){
      var cat = item.category || "その他";
      if (!byCat[cat]) { byCat[cat] = []; catOrder.push(cat); }
      byCat[cat].push(item);
    });
    catOrder.forEach(function(cat){
      var h = document.createElement("div");
      h.className = "menu-cat";
      h.textContent = cat;
      el.appendChild(h);
      var g = document.createElement("div");
      g.className = "menu-grid";
      byCat[cat].forEach(function(item){
        var b = document.createElement("button");
        b.className = "menu-item-btn";
        b.innerHTML = '<span class="n">' + escapeHtml(item.name) + '</span><span class="p">' + fmtYen(item.price) + '</span>';
        b.addEventListener("click", function(){ addItemToOrder(item); });
        g.appendChild(b);
      });
      el.appendChild(g);
    });
  }

  async function addItemToOrder(menuItem){
    var order = findOrder(activeOrderId);
    if (!order) return;
    var line = order.items.find(function(it){ return it.menu_item_id === menuItem.id; });
    var res;
    if (line) {
      res = await sb.from("order_items").update({ qty: line.qty + 1 }).eq("id", line.id);
    } else {
      res = await sb.from("order_items").insert({
        order_id: order.id, menu_item_id: menuItem.id, name: menuItem.name, price: menuItem.price, qty: 1
      });
    }
    if (res.error) { console.warn(res.error); toast("追加に失敗しました"); return; }
    await loadDay(currentDay);
  }

  function renderOrderLines(){
    var order = findOrder(activeOrderId);
    if (!order) return;
    var el = document.getElementById("orderLines");
    el.innerHTML = "";
    if (order.items.length === 0) {
      el.innerHTML = '<div class="empty-state">メニューをタップして追加してください</div>';
    } else {
      order.items.forEach(function(it){
        var row = document.createElement("div");
        row.className = "order-row";
        row.innerHTML =
          '<div class="name">' + escapeHtml(it.name) + '</div>' +
          '<div class="qty-stepper">' +
            '<button data-act="dec">−</button>' +
            '<span class="qty">' + it.qty + '</span>' +
            '<button data-act="inc">＋</button>' +
          '</div>' +
          '<div class="line-total">' + fmtYen(it.price * it.qty) + '</div>';
        row.querySelector('[data-act="inc"]').addEventListener("click", async function(){
          await sb.from("order_items").update({ qty: it.qty + 1 }).eq("id", it.id);
          await loadDay(currentDay);
        });
        row.querySelector('[data-act="dec"]').addEventListener("click", async function(){
          if (it.qty - 1 <= 0) { await sb.from("order_items").delete().eq("id", it.id); }
          else { await sb.from("order_items").update({ qty: it.qty - 1 }).eq("id", it.id); }
          await loadDay(currentDay);
        });
        el.appendChild(row);
      });
    }
    document.getElementById("orderTotal").textContent = fmtYen(order.computedTotal);
  }

  document.getElementById("deleteOrderBtn").addEventListener("click", function(){
    var order = findOrder(activeOrderId);
    if (!order) return;
    showConfirm("「" + orderDisplayLabel(order) + "」を削除します。よろしいですか？", async function(){
      var res = await sb.from("orders").delete().eq("id", order.id);
      if (res.error) { console.warn(res.error); toast("削除に失敗しました"); return; }
      orderOverlay.classList.remove("active");
      activeOrderId = null;
      await loadDay(currentDay);
      toast("削除しました");
    });
  });

  // ---------- Checkout / payment ----------
  var payOverlay = document.getElementById("payOverlay");

  document.getElementById("checkoutBtn").addEventListener("click", function(){
    var order = findOrder(activeOrderId);
    if (!order) return;
    if (order.items.length === 0) { toast("商品を追加してください"); return; }
    pendingPayMethod = null;
    document.getElementById("payAmount").textContent = fmtYen(order.computedTotal);
    var wrap = document.getElementById("payMethodButtons");
    wrap.innerHTML = "";
    PAY_METHODS.forEach(function(pm){
      var b = document.createElement("button");
      b.textContent = pm.label;
      b.addEventListener("click", function(){
        pendingPayMethod = pm.id;
        wrap.querySelectorAll("button").forEach(function(x){ x.classList.remove("selected"); });
        b.classList.add("selected");
      });
      wrap.appendChild(b);
    });
    payOverlay.classList.add("active");
  });

  document.getElementById("closePaySheet").addEventListener("click", function(){
    payOverlay.classList.remove("active");
  });
  payOverlay.addEventListener("click", function(e){ if (e.target === payOverlay) payOverlay.classList.remove("active"); });

  document.getElementById("confirmPayBtn").addEventListener("click", async function(){
    if (!pendingPayMethod) { toast("支払い方法を選択してください"); return; }
    var order = findOrder(activeOrderId);
    if (!order) return;
    var res = await sb.from("orders").update({
      status: "completed",
      payment_method: pendingPayMethod,
      total: order.computedTotal,
      closed_at: new Date().toISOString()
    }).eq("id", order.id);
    if (res.error) { console.warn(res.error); toast("会計に失敗しました"); return; }
    payOverlay.classList.remove("active");
    orderOverlay.classList.remove("active");
    activeOrderId = null;
    await loadDay(currentDay);
    toast("会計が完了しました");
  });

  // ---------- Menu edit screen ----------
  function renderMenuEdit(){
    var el = document.getElementById("menuEditList");
    el.innerHTML = "";
    if (menu.length === 0) {
      el.innerHTML = '<div class="empty-state">メニューがありません。上のフォームから追加してください。</div>';
      return;
    }
    menu.forEach(function(item){
      var row = document.createElement("div");
      row.className = "menu-edit-row";
      row.innerHTML =
        '<input type="text" value="' + escapeHtml(item.name) + '" data-f="name">' +
        '<input type="number" value="' + item.price + '" min="0" step="10" data-f="price">' +
        '<input type="text" value="' + escapeHtml(item.category) + '" data-f="category" style="width:90px">' +
        '<button class="icon-btn" data-act="del">🗑</button>';
      row.querySelector('[data-f="name"]').addEventListener("change", async function(e){
        await sb.from("menu_items").update({ name: e.target.value || item.name }).eq("id", item.id);
        await loadMenu();
      });
      row.querySelector('[data-f="price"]').addEventListener("change", async function(e){
        var p = Math.max(0, parseInt(e.target.value,10) || 0);
        await sb.from("menu_items").update({ price: p }).eq("id", item.id);
        await loadMenu();
      });
      row.querySelector('[data-f="category"]').addEventListener("change", async function(e){
        await sb.from("menu_items").update({ category: e.target.value || "その他" }).eq("id", item.id);
        await loadMenu();
      });
      row.querySelector('[data-act="del"]').addEventListener("click", function(){
        showConfirm('「' + item.name + '」を削除します。よろしいですか？', async function(){
          await sb.from("menu_items").delete().eq("id", item.id);
          await loadMenu();
          toast("削除しました");
        });
      });
      el.appendChild(row);
    });
  }

  document.getElementById("addMenuItemBtn").addEventListener("click", async function(){
    var nameEl = document.getElementById("newItemName");
    var priceEl = document.getElementById("newItemPrice");
    var catEl = document.getElementById("newItemCat");
    var name = nameEl.value.trim();

  function purchaseTaxSubtotals(list){

  // ---------- 売上分配・給与計算 (payroll) ----------
  var ATTENDANCE_ITEMS = { inohara: "猪原ドリンク", sato: "風壱ドリンク" };
  var MANAGER_SHARE = 0.3; // 店長の取り分（店舗粗利に対する割合）

  function sumItemQtyByName(orders, name){
    var total = 0;
    orders.forEach(function(o){
      (o.items || []).forEach(function(it){
        if (it.name === name) total += it.qty;
      });
    });
    return total;
  }

  // 完了済み注文(salesOrders)と仕入れ額から日次分の給与配分を1件分計算する。
  // attendanceOrders は出勤判定に使う注文明細（当日はまだ会計前の卓も含める）。
  function computePayrollFromOrders(salesOrders, costTotal, attendanceOrders){
    var cashSales = 0, creditSales = 0;
    salesOrders.forEach(function(o){
      var amt = (o.computedTotal != null) ? o.computedTotal : (o.total || 0);
      if (o.payment_method === "cash") cashSales += amt;
      else creditSales += amt; // PayPay・カード・その他はすべて「クレジット売上」扱い
    });
    var totalSales = cashSales + creditSales;
    var grossProfit = totalSales - costTotal;
    var managerPay = grossProfit * MANAGER_SHARE;
    var managerSettlement = managerPay - creditSales;
    var distributable = grossProfit - managerPay;

    var inoharaQty = sumItemQtyByName(attendanceOrders || salesOrders, ATTENDANCE_ITEMS.inohara);
    var satoQty = sumItemQtyByName(attendanceOrders || salesOrders, ATTENDANCE_ITEMS.sato);
    var inoharaPresent = inoharaQty >= 1;
    var satoPresent = satoQty >= 1;

    var inoharaPay = 0, satoPay = 0, storeRetained = 0;
    if (inoharaPresent && satoPresent) {
      inoharaPay = distributable * 0.5;
      satoPay = distributable * 0.5;
    } else if (inoharaPresent) {
      inoharaPay = distributable;
    } else if (satoPresent) {
      satoPay = distributable;
    } else {
      storeRetained = distributable;
    }

    return {
      cashSales: cashSales, creditSales: creditSales, totalSales: totalSales, costTotal: costTotal,
      grossProfit: grossProfit, managerPay: managerPay, managerSettlement: managerSettlement,
      distributable: distributable, inoharaQty: inoharaQty, satoQty: satoQty,
      inoharaPresent: inoharaPresent, satoPresent: satoPresent,
      inoharaPay: inoharaPay, satoPay: satoPay, storeRetained: storeRetained
    };
  }

  function computePayroll(){
    var costTotal = purchaseTotalOf(dayData.purchases);
    return computePayrollFromOrders(dayData.completed, costTotal, dayData.open.concat(dayData.completed));
  }

  // 月間の給与配分は、営業日ごとに①〜④を計算してから合算する
  // （分配ルールは日単位の出勤判定に基づくため、月の数字をまとめてから計算すると結果が変わってしまう）
  function computeMonthPayroll(orders, byDayCost){
    var byDay = {};
    orders.forEach(function(o){
      var d = o.business_day;
      if (!byDay[d]) byDay[d] = [];
      byDay[d].push({
        computedTotal: o.total || 0,
        payment_method: o.payment_method,
        items: o.order_items || []
      });
    });
    var dayKeys = Array.from(new Set(Object.keys(byDay).concat(Object.keys(byDayCost))));
    var sum = {
      cashSales: 0, creditSales: 0, totalSales: 0, costTotal: 0, grossProfit: 0,
      managerPay: 0, managerSettlement: 0, distributable: 0,
      inoharaQty: 0, satoQty: 0, inoharaDays: 0, satoDays: 0,
      inoharaPay: 0, satoPay: 0, storeRetained: 0
    };
    dayKeys.forEach(function(d){
      var dOrders = byDay[d] || [];
      var dCost = byDayCost[d] || 0;
      var dp = computePayrollFromOrders(dOrders, dCost, dOrders);
      sum.cashSales += dp.cashSales;
      sum.creditSales += dp.creditSales;
      sum.totalSales += dp.totalSales;
      sum.costTotal += dCost;
      sum.grossProfit += dp.grossProfit;
      sum.managerPay += dp.managerPay;
      sum.managerSettlement += dp.managerSettlement;
      sum.distributable += dp.distributable;
      sum.inoharaQty += dp.inoharaQty;
      sum.satoQty += dp.satoQty;
      if (dp.inoharaPresent) sum.inoharaDays++;
      if (dp.satoPresent) sum.satoDays++;
      sum.inoharaPay += dp.inoharaPay;
      sum.satoPay += dp.satoPay;
      sum.storeRetained += dp.storeRetained;
    });
    return sum;
  }

    document.getElementById("payrollTiles").innerHTML =
      tileHtml("総売上", fmtYen(p.totalSales)) +

      tileHtml("店長総報酬額（粗利30%）", fmtYen(p.managerPay)) +

    settleEl.className = "settle-card" + (isNegative ? " negative" : "");
    settleEl.innerHTML =

      '<div class="val">' + fmtYen(Math.abs(p.managerSettlement)) + '</div>' +
      '<div class="note">店長総報酬額 ' + fmtYen(p.managerPay) + ' − クレジット売上（PayPay・カード・その他含む） ' + fmtYen(p.creditSales) +
        (isNegative ? '　※クレジット売上が総報酬額を上回ったため、店長から店舗へ返金してください' : '　※現金売上から店長へこの金額を精算してください') +
        (monthly ? '　※営業日ごとに計算した金額を月内で合計しています' : '') + '</div>';
  }

  async function renderMonthSummary(){
    var monthPicker = document.getElementById("monthPicker");
    var monthStr = monthPicker.value || currentDay.slice(0,7);
    document.getElementById("summaryTitle").textContent = monthStr + " の月次集計";
    document.getElementById("breakdownTitle").textContent = "営業日ごとの内訳";

    var parts = monthStr.split("-");
    var y = parseInt(parts[0],10), m = parseInt(parts[1],10);
    var startStr = monthStr + "-01";
    var lastDay = new Date(y, m, 0).getDate();
    var endStr = monthStr + "-" + String(lastDay).padStart(2,"0");

    var results = await Promise.all([
      sb.from("orders").select("business_day, total, payment_method, order_items(name, qty)").eq("status","completed").gte("business_day", startStr).lte("business_day", endStr),
      sb.from("purchases").select("business_day, amount").gte("business_day", startStr).lte("business_day", endStr)
    ]);
    var ordersRes = results[0], purchasesRes = results[1];
    if (ordersRes.error || purchasesRes.error) {
      console.warn(ordersRes.error || purchasesRes.error);
      toast("月次データの取得に失敗しました");
      return;
    }
    var orders = ordersRes.data || [];
    var purchases = purchasesRes.data || [];

    var totalSales = 0, costTotal = 0;
    var byMethod = {};
    PAY_METHODS.forEach(function(pm){ byMethod[pm.id] = 0; });
    var byDaySales = {}, byDayCount = {}, byDayCost = {};

    orders.forEach(function(o){
      var t = o.total || 0;
      totalSales += t;
      byMethod[o.payment_method] = (byMethod[o.payment_method]||0) + t;
      byDaySales[o.business_day] = (byDaySales[o.business_day]||0) + t;
      byDayCount[o.business_day] = (byDayCount[o.business_day]||0) + 1;
    });
    purchases.forEach(function(p){
      costTotal += p.amount;
      byDayCost[p.business_day] = (byDayCost[p.business_day]||0) + p.amount;
    });

    renderStatTiles(totalSales, orders.length, costTotal);
    renderPaymentBars(byMethod);

    document.getElementById("payrollSection").hidden = false;
    renderPayrollUI(computeMonthPayroll(orders, byDayCost), true);

    var dayKeys = Array.from(new Set(Object.keys(byDaySales).concat(Object.keys(byDayCost)))).sort();
    var listEl = document.getElementById("completedList");
    listEl.innerHTML = "";
    if (dayKeys.length === 0) {
      listEl.innerHTML = '<div class="empty-state">この月のデータがありません</div>';
    } else {
      dayKeys.slice().reverse().forEach(function(k){
        var sales = byDaySales[k] || 0;
        var cost = byDayCost[k] || 0;
        var count = byDayCount[k] || 0;
        var profit = sales - cost;
        var profitCls = profit >= 0 ? "positive" : "negative";
        var profitTxt = (profit < 0 ? "-" : "") + fmtYen(Math.abs(profit));
        var row = document.createElement("div");
        row.className = "day-row";
        row.innerHTML =
          '<div class="info"><div class="l">' + k + '</div><div class="t">会計 ' + count + '件 ・ 仕入れ ' + fmtYen(cost) + '</div></div>' +
          '<div class="amt">' + fmtYen(sales) + '<span class="profit-sub ' + profitCls + '">粗利 ' + profitTxt + '</span></div>' +
          '<div style="color:var(--text-muted);font-size:16px;flex-shrink:0">›</div>';
        row.addEventListener("click", async function(){
          currentDay = k;
          dayPicker.value = k;
          summaryMode = "day";
          document.querySelectorAll("#summaryModeToggle .mode-btn").forEach(function(b){
            b.classList.toggle("active", b.dataset.mode === "day");
          });
          document.getElementById("monthPickerRow").style.display = "none";
          await loadDay(currentDay);
          renderSummary();
        });
        listEl.appendChild(row);
      });
    }
  }

  monthPickerEl.value = currentDay.slice(0,7);
  monthPickerEl.addEventListener("change", function(){ renderSummary(); });

  // ---------- Confirm dialog ----------
  var confirmOverlay = document.getElementById("confirmOverlay");
  function showConfirm(text, onOk){
    document.getElementById("confirmText").textContent = text;
    confirmCallback = onOk;
    confirmOverlay.classList.add("active");
  }
  document.getElementById("confirmCancelBtn").addEventListener("click", function(){
    confirmOverlay.classList.remove("active"); confirmCallback = null;
  });
  document.getElementById("confirmOkBtn").addEventListener("click", function(){
    confirmOverlay.classList.remove("active");
    if (confirmCallback) confirmCallback();
    confirmCallback = null;
  });
  confirmOverlay.addEventListener("click", function(e){
    if (e.target === confirmOverlay) { confirmOverlay.classList.remove("active"); confirmCallback = null; }
  });

  // ---------- Realtime sync across devices ----------
  var reloadTimer = null;
  function scheduleReload(){
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(function(){
      loadDay(currentDay);
      if (currentScreen === "screen-summary" && summaryMode === "month") renderMonthSummary();
    }, 400);
  }

  function initRealtime(){
    sb.channel("izakaya-sync")
      .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, scheduleReload)
      .on("postgres_changes", { event: "*", schema: "public", table: "order_items" }, scheduleReload)
      .on("postgres_changes", { event: "*", schema: "public", table: "purchases" }, scheduleReload)
      .on("postgres_changes", { event: "*", schema: "public", table: "menu_items" }, function(){ loadMenu(); })
      .subscribe(function(status){
        if (status === "SUBSCRIBED") setSyncDot("ok");
        else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") setSyncDot("err");
      });
  }

  async function startApp(){
    setSyncDot("");
    await Promise.all([loadMenu(), loadDay(currentDay)]);
    initRealtime();
  }

  // ---------- Passphrase gate ----------
  var lockScreen = document.getElementById("lockScreen");
  var lockPinInput = document.getElementById("lockPinInput");
  var lockErrMsg = document.getElementById("lockErrMsg");
  var lockSubmitBtn = document.getElementById("lockSubmitBtn");

  function showLockScreen(prefillError){
    lockScreen.classList.remove("hidden");
    lockErrMsg.textContent = prefillError || "";
    lockPinInput.value = "";
    setTimeout(function(){ lockPinInput.focus(); }, 50);
  }

  async function tryUnlock(pin){
    lockSubmitBtn.disabled = true;
    lockErrMsg.textContent = "";
    try {
      var res = await sb.rpc("check_pin", { p_pin: pin });
      if (res.error) {
        console.warn(res.error);
        lockErrMsg.textContent = "確認できませんでした。ネット接続をご確認ください。";
        return false;
      }
      if (!res.data) {
        lockErrMsg.textContent = "合言葉が違います";
        return false;
      }
      localStorage.setItem(PIN_STORAGE_KEY, pin);
      sb = makeClient(pin);
      lockScreen.classList.add("hidden");
      await startApp();
      return true;
    } finally {
      lockSubmitBtn.disabled = false;
    }
  }

  lockSubmitBtn.addEventListener("click", function(){
    var pin = lockPinInput.value.trim();
    if (!pin) { lockErrMsg.textContent = "合言葉を入力してください"; return; }
    tryUnlock(pin);
  });
  lockPinInput.addEventListener("keydown", function(e){
    if (e.key === "Enter") lockSubmitBtn.click();
  });

  async function init(){
    var savedPin = localStorage.getItem(PIN_STORAGE_KEY);
    if (savedPin) {
      var ok = await tryUnlock(savedPin);
      if (ok) return;
    }
    showLockScreen();
  }

  init();
})();
</script>
</body>
</html>
